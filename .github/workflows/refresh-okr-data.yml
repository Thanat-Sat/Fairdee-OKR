name: Refresh OKR data from Redshift

# Mirrors the Redshift OKR table into a single Firestore document
# (okr_data/okr-2026) once a day. The dashboard reads that doc as a signed-in
# @fairdee.co.th user — the numbers are never published to a public file.

on:
  schedule:
    # 09:00 Asia/Bangkok (ICT, UTC+7) == 02:00 UTC, every day. (No DST in Thailand.)
    - cron: '0 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: refresh-okr-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install db-tools dependencies
        working-directory: db-tools
        run: npm install --no-audit --no-fund

      - name: Mirror Redshift -> Firestore
        working-directory: db-tools
        env:
          # Redshift (read)
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSL: ${{ secrets.PGSSL || 'require' }}
          # Firestore (write) — service account for the fairdee-monthly-metr project
          FIRESTORE_SA_JSON: ${{ secrets.FIRESTORE_SA_JSON }}
        run: node export-okr-firestore.js
