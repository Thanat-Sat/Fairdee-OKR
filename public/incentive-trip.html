<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/fairdee-favicon.png">
    <title>Incentive Trip Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root { --it-violet: #8B5CF6; --it-border: #E8ECF0; --it-navy: #0A0E27; }
        body { background: #FAFBFC; font-family: 'Google Sans Text', sans-serif; color: #0A0E27; margin: 0; }
        .it-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: #fff; border-bottom: 1px solid var(--it-border); }
        .it-header img { height: 28px; }
        .it-back { font-size: 0.85rem; color: #5F6C7B; text-decoration: none; }
        .it-wrap { padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
        .it-title { font-size: 1.6rem; font-weight: 800; margin: 0; color: var(--it-navy); }
        .it-sub { color: #5F6C7B; font-size: 0.85rem; margin: 0.25rem 0 1.25rem; }
        .it-chips { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .it-chip { background: #fff; border: 1px solid var(--it-border); border-radius: 12px; padding: 0.85rem 1.25rem; box-shadow: 0 2px 8px rgba(10,14,39,0.04); min-width: 150px; }
        .it-chip .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: #5F6C7B; font-weight: 700; }
        .it-chip .val { font-size: 1.4rem; font-weight: 800; color: var(--it-navy); margin-top: 0.2rem; }
        .it-card { background: #fff; border: 1px solid var(--it-border); border-radius: 12px; box-shadow: 0 4px 12px rgba(10,14,39,0.06); padding: 1.5rem 1.75rem; margin-bottom: 1.5rem; }
        .it-card h2 { font-size: 1.15rem; font-weight: 800; color: var(--it-navy); margin: 0 0 1rem; }
        .it-toolbar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .it-toolbar input[type="text"], .it-toolbar select {
            padding: 0.5rem 0.75rem; border: 1px solid var(--it-border); border-radius: 8px;
            font-family: inherit; font-size: 0.85rem; background: #fff; color: #0A0E27;
        }
        .it-chart-box { position: relative; height: 460px; }
        table.it-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table.it-table thead { background: linear-gradient(135deg, #0A0E27 0%, #1A1F3A 100%); color: #fff; }
        table.it-table th { padding: 0.8rem 0.9rem; text-align: left; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
        table.it-table th.num, table.it-table td.num { text-align: right; font-family: 'Google Sans Text', monospace; }
        table.it-table td { padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--it-border); }
        table.it-table tbody tr:hover { background: #FAFBFC; }
        .it-rank { font-weight: 800; text-align: center; width: 2.5rem; }
        .it-medal { font-size: 1.1rem; }
        .it-name { font-weight: 600; }
        .it-code { font-family: 'Google Sans Text', monospace; color: #5F6C7B; font-size: 0.82rem; }
        tr.top1 td { background: #FFFBEB; }
        tr.top2 td { background: #F8FAFC; }
        tr.top3 td { background: #FEF6F0; }
        .it-region { display: inline-block; padding: 0.12rem 0.5rem; border-radius: 999px; background: #EEF2FF; color: #4F46E5; font-size: 0.74rem; font-weight: 700; }
        .it-empty, .it-loading { padding: 2.5rem; text-align: center; color: #5F6C7B; }
        .it-card-scroll { overflow-x: auto; }
    </style>
</head>
<body>
    <div class="it-header" id="itHeader">
        <img src="assets/fairdee-logo.png" alt="Fairdee">
        <a href="index.html" class="it-back">← Back to Hub</a>
    </div>

    <div class="it-wrap">
        <h1 class="it-title">Incentive Trip Monitor</h1>
        <p class="it-sub">Live ranking of agents by qualifying premium for the incentive trip.</p>

        <div class="it-chips" id="itChips"></div>

        <div class="it-card">
            <h2>Top Ranking by Premium</h2>
            <div class="it-toolbar">
                <label style="font-size: 0.8rem; color: #5F6C7B; font-weight: 600;">Show top
                    <select id="itTopN">
                        <option value="10">10</option>
                        <option value="15" selected>15</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="9999">All</option>
                    </select>
                </label>
                <select id="itRegionChart"><option value="">All regions</option></select>
            </div>
            <div class="it-chart-box"><canvas id="itChart"></canvas></div>
        </div>

        <div class="it-card">
            <h2>Leaderboard</h2>
            <div class="it-toolbar">
                <input type="text" id="itSearch" placeholder="Search name, code, province…" autocomplete="off">
                <select id="itRegionTable"><option value="">All regions</option></select>
            </div>
            <div class="it-card-scroll">
                <table class="it-table">
                    <thead>
                        <tr>
                            <th class="it-rank">#</th>
                            <th>Agent</th>
                            <th>Code</th>
                            <th>Province</th>
                            <th>Region</th>
                            <th>Leader</th>
                            <th class="num">Premium (THB)</th>
                        </tr>
                    </thead>
                    <tbody id="itBody">
                        <tr><td colspan="7" class="it-loading">Loading incentive trip data…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
    (function () {
        'use strict';

        var SHEET_ID = '1M51L7xRu_Y8MRO5ziDVZ4pbWtqi0Mxb1-oJ6WyfwKU0';
        var GID = '1278667314';

        var rows = [];   // [{rank, code, name, province, region, leader, premium}]
        var chart = null;

        if (window.self !== window.top) {
            var h = document.getElementById('itHeader');
            if (h) h.style.display = 'none';
        }

        function num(v) { return parseFloat(String(v == null ? '' : v).replace(/,/g, '')) || 0; }
        function fmtMoney(v) { return Math.round(v).toLocaleString('en-US'); }
        function fmtShort(v) {
            if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
            if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
            return String(Math.round(v));
        }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function medalSvg(rank) {
            var c = rank === 1 ? '#F59E0B' : rank === 2 ? '#94A3B8' : '#B45309';
            return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="' + c +
                '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;">' +
                '<circle cx="12" cy="8" r="6"></circle><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"></path></svg>';
        }

        function fetchData() {
            var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=' + GID;
            fetch(url)
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(function (csv) {
                    Papa.parse(csv, {
                        header: true, skipEmptyLines: true,
                        transformHeader: function (h) { return h.trim(); },
                        complete: function (res) { process(res.data, res.meta.fields || []); },
                        error: function (err) { showError(err.message); }
                    });
                })
                .catch(function (e) { showError(e.message); });
        }

        function process(data, fields) {
            // The premium column header is long ("Sum of … → premium_without_tax_local_amt")
            var premKey = fields.find(function (f) { return /premium/i.test(f); }) ||
                          fields[fields.length - 1];

            rows = data.map(function (r) {
                return {
                    code: (r.agent_code || '').trim(),
                    name: (r.agent_name || '').trim(),
                    province: (r.agent_province || '').trim(),
                    region: (r.agent_region || '').trim(),
                    leader: (r.leader_code || '').trim(),
                    premium: num(r[premKey])
                };
            }).filter(function (r) { return r.code || r.name; })
              .sort(function (a, b) { return b.premium - a.premium; });

            rows.forEach(function (r, i) { r.rank = i + 1; });

            populateRegions();
            updateChips();
            renderChart();
            renderTable();
        }

        function showError(msg) {
            document.getElementById('itBody').innerHTML =
                '<tr><td colspan="7" class="it-empty">Could not load data: ' + esc(msg) + '</td></tr>';
        }

        function regions() {
            var set = {};
            rows.forEach(function (r) { if (r.region) set[r.region] = true; });
            return Object.keys(set).sort();
        }

        function populateRegions() {
            var opts = '<option value="">All regions</option>' +
                regions().map(function (rg) { return '<option value="' + esc(rg) + '">' + esc(rg) + '</option>'; }).join('');
            document.getElementById('itRegionChart').innerHTML = opts;
            document.getElementById('itRegionTable').innerHTML = opts;
        }

        function updateChips() {
            var total = rows.reduce(function (s, r) { return s + r.premium; }, 0);
            var top = rows[0];
            document.getElementById('itChips').innerHTML =
                chip('Qualifiers', rows.length) +
                chip('Total premium', fmtMoney(total)) +
                chip('Top agent', top ? esc(top.name || top.code) : '–') +
                chip('Top premium', top ? fmtMoney(top.premium) : '0');
        }
        function chip(lbl, val) {
            return '<div class="it-chip"><div class="lbl">' + lbl + '</div><div class="val">' + val + '</div></div>';
        }

        // ---- Ranking chart (horizontal bars) ----
        function renderChart() {
            var topN = parseInt(document.getElementById('itTopN').value, 10) || 15;
            var region = document.getElementById('itRegionChart').value;
            var data = rows.filter(function (r) { return !region || r.region === region; }).slice(0, topN);

            var labels = data.map(function (r) {
                var nm = r.name || r.code;
                return nm.length > 24 ? nm.slice(0, 23) + '…' : nm;
            });
            var values = data.map(function (r) { return r.premium; });
            var colors = data.map(function (r) {
                return r.rank === 1 ? '#F59E0B' : r.rank === 2 ? '#94A3B8' : r.rank === 3 ? '#B45309' : '#8B5CF6';
            });

            if (chart) chart.destroy();
            var canvas = document.getElementById('itChart');
            canvas.parentNode.style.height = Math.max(300, data.length * 28 + 60) + 'px';

            chart = new Chart(canvas.getContext('2d'), {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Premium', data: values, backgroundColor: colors, borderRadius: 4, maxBarThickness: 22 }] },
                options: {
                    indexAxis: 'y',
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: function (c) { return fmtMoney(c.parsed.x) + ' THB'; },
                            title: function (items) { var d = data[items[0].dataIndex]; return '#' + d.rank + '  ' + (d.name || d.code); } } }
                    },
                    scales: {
                        x: { beginAtZero: true, ticks: { callback: function (v) { return fmtShort(v); } }, grid: { color: 'rgba(0,0,0,0.05)' } },
                        y: { grid: { display: false }, ticks: { font: { size: 11 } } }
                    }
                }
            });
        }

        // ---- Leaderboard table ----
        function renderTable() {
            var q = (document.getElementById('itSearch').value || '').toLowerCase().trim();
            var region = document.getElementById('itRegionTable').value;
            var body = document.getElementById('itBody');

            var visible = rows.filter(function (r) {
                if (region && r.region !== region) return false;
                if (q && (r.code + ' ' + r.name + ' ' + r.province).toLowerCase().indexOf(q) === -1) return false;
                return true;
            });

            if (!visible.length) {
                body.innerHTML = '<tr><td colspan="7" class="it-empty">No agents match your filter.</td></tr>';
                return;
            }

            body.innerHTML = visible.map(function (r) {
                var cls = r.rank <= 3 ? ' class="top' + r.rank + '"' : '';
                return '<tr' + cls + '>' +
                    '<td class="it-rank">' + (r.rank <= 3 ? medalSvg(r.rank) : r.rank) + '</td>' +
                    '<td class="it-name">' + esc(r.name || '–') + '</td>' +
                    '<td class="it-code">' + esc(r.code) + '</td>' +
                    '<td>' + esc(r.province || '–') + '</td>' +
                    '<td>' + (r.region ? '<span class="it-region">' + esc(r.region) + '</span>' : '–') + '</td>' +
                    '<td class="it-code">' + esc(r.leader || '–') + '</td>' +
                    '<td class="num" style="font-weight:700;">' + fmtMoney(r.premium) + '</td>' +
                    '</tr>';
            }).join('');
        }

        document.getElementById('itTopN').addEventListener('change', renderChart);
        document.getElementById('itRegionChart').addEventListener('change', renderChart);
        document.getElementById('itSearch').addEventListener('input', renderTable);
        document.getElementById('itRegionTable').addEventListener('change', renderTable);

        fetchData();
    })();
    </script>
</body>
</html>
