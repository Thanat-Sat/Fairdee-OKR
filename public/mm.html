<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="icon" type="image/png" href="assets/fairdee-favicon.png">
    <link rel="apple-touch-icon" href="assets/fairdee-apple-touch-icon.png">
<title>Executive Sales Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <div class="brand">
                    <img src="assets/fairdee-logo.png" alt="Fairdee" class="brand-logo">
                    <h1>Monthly Metrics Dashboard</h1>
                </div>
                <div class="user-menu">
                    <div id="googleSheetSyncStatus" class="sheet-sync-status sheet-sync-loading">
                        <span class="sheet-sync-dot"></span>
                        <span>Checking Google Sheets...</span>
                    </div>
                    <a href="index.html" class="home-btn">← Home</a>
                    <div class="month-selector-wrapper">
                        <label for="globalMonthSelect" class="month-selector-label">Month:</label>
                        <select id="globalMonthSelect" class="global-month-select" aria-label="Select month">
                            <option value="01">January</option>
                            <option value="02">February</option>
                            <option value="03">March</option>
                            <option value="04">April</option>
                            <option value="05">May</option>
                            <option value="06">June</option>
                            <option value="07">July</option>
                            <option value="08">August</option>
                            <option value="09">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                        <select id="globalYearSelect" class="global-month-select global-year-select" aria-label="Select year">
                            <option value="">Year</option>
                        </select>
                    </div>
                    <button id="refreshBtn" class="refresh-btn" title="Refresh all dashboards">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0118.8-4.3M22 12.5a10 10 0 01-18.8 4.2"/>
                        </svg>
                        Refresh
                    </button>
                    <span id="userEmail" class="user-email"></span>
                    <button id="signOutBtn" class="sign-out-btn">Sign Out</button>
                </div>
            </div>


            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-button active" data-tab="executive">Executive Summary</button>
                <button class="tab-button" data-tab="recap">Performance Recap</button>
                <button class="tab-button" data-tab="overview">Channel Overview</button>
                <button class="tab-button" data-tab="mlm">MLM Team Performance</button>
                <button class="tab-button" data-tab="focusteam">Focus Team Performance</button>
                <button class="tab-button" data-tab="agency">Agency Performance</button>
                <button class="tab-button" data-tab="segment">Segment Activation</button>
                <button class="tab-button" data-tab="renewal">Renewal Rate</button>
                <button class="tab-button" data-tab="targets">Targets</button>
            </div>
        </header>

        <!-- Executive Summary Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="executiveContainer">
            <iframe id="executiveFrame" src="executive-summary.html" frameborder="0"></iframe>
        </div>

        <!-- Performance Recap Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="recapContainer" style="display: none;">
            <iframe id="recapFrame" src="performance-recap.html" frameborder="0"></iframe>
        </div>

        <!-- Channel Overview Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="channelContainer" style="display: none;">
            <iframe id="channelFrame" src="channel-dashboard.html" frameborder="0"></iframe>
        </div>

        <!-- MLM Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="mlmContainer" style="display: none;">
            <iframe id="mlmFrame" src="mlm-dashboard.html" frameborder="0"></iframe>
        </div>

        <!-- Focus Team Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="focusContainer" style="display: none;">
            <iframe id="focusFrame" src="focus-team-dashboard.html" frameborder="0"></iframe>
        </div>

        <!-- Agency Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="agencyContainer" style="display: none;">
            <iframe id="agencyFrame" src="agency-dashboard.html" frameborder="0"></iframe>
        </div>

        <!-- Segment Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="segmentContainer" style="display: none;">
            <iframe id="segmentFrame" src="segment-dashboard.html" frameborder="0"></iframe>
        </div>

        <!-- Renewal Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="renewalContainer" style="display: none;">
            <iframe id="renewalFrame" src="renewal-dashboard.html" frameborder="0"></iframe>
        </div>

        <!-- Targets Dashboard (loaded in iframe) -->
        <div class="iframe-container" id="targetsContainer" style="display: none;">
            <iframe id="targetsFrame" src="targets-dashboard.html" frameborder="0"></iframe>
        </div>
    </div>


    <!-- Firebase SDK (COMPAT — REQUIRED) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>


    <!-- Your Firebase config MUST be after SDK -->
    <script src="firebase-config.js"></script>


    <!-- Centralized Data Store -->
    <script src="dashboard-data-store.js"></script>

    <script src="app.js"></script>
</body>
</html>
