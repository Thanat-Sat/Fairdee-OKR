<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="icon" type="image/png" href="assets/fairdee-favicon.png">
    <link rel="apple-touch-icon" href="assets/fairdee-apple-touch-icon.png">
<title>Agency Performance Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1778061958986">
</head>
<body>
    <div id="loadingBar" class="loading-bar"></div>
    <div class="container">
        <!-- Header (hidden when in iframe) -->
        <header class="dashboard-header" id="dashboardHeader">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-icon"></div>
                    <h1>Agency Performance</h1>
                </div>
                <a href="index.html" class="back-link">← Back to Main Dashboard</a>
            </div>
        </header>

        <!-- No Data Message -->
        <section class="upload-section" id="noDataSection">
            <div class="upload-zone">
                <div class="upload-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
                    </svg>
                </div>
                <h2>No Agency Data Available</h2>
                <p>No agency data is currently available.</p>
            </div>
        </section>

        <!-- Dashboard Content -->
        <div class="dashboard-content" id="dashboardContent" style="display: none;">


            <section class="agency-section">
                <div class="section-header">
                    <h2>Agency</h2>
                    <div class="section-header-actions">
                        <span id="dataStatus" style="font-size: 0.875rem; color: #10b981;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.15em;"><polyline points="20 6 9 17 4 12"></polyline></svg> Data loaded from storage
                        </span>
                        <button class="upload-button" onclick="openAgencyTargetsModal()" style="padding: 0.625rem 1.25rem;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px; vertical-align: middle;">
                                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            Set Targets
                        </button>
                    </div>
                </div>

                <!-- Agency Table -->
                <div class="agency-table-container">
                    <table class="agency-table">
                        <thead id="agencyTableHead">
                            <!-- Headers will be populated dynamically -->
                        </thead>
                        <tbody id="agencyTableBody">
                            <!-- Data will be populated here -->
                        </tbody>
                    </table>
                </div>

            </section>

        </div>
    </div>

    <!-- Agency Targets Modal -->
    <div id="agencyTargetsModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Set Agency Targets</h2>
                <button class="modal-close" onclick="closeAgencyTargetsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Month *</label>
                    <input type="month" id="agencyTargetMonth" class="form-input" required>
                </div>

                <h3 style="margin: 1.5rem 0 1rem 0; color: var(--text-primary);">Agency Targets</h3>

                <div class="form-group">
                    <label class="form-label">Total Agents (count)</label>
                    <input type="number" id="agencyTarget_totalAgents" class="form-input" placeholder="e.g., 1500" step="1" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">New Agents (count)</label>
                    <input type="number" id="agencyTarget_newAgents" class="form-input" placeholder="e.g., 150" step="1" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Acquisition Rate (%)</label>
                    <input type="number" id="agencyTarget_acquisitionRate" class="form-input" placeholder="e.g., 10" step="0.1" min="0" max="100">
                </div>
                <div class="form-group">
                    <label class="form-label">Active Agents (count)</label>
                    <input type="number" id="agencyTarget_activeAgents" class="form-input" placeholder="e.g., 1200" step="1" min="0">
                </div>

                <div class="modal-actions">
                    <button type="button" class="button-secondary" onclick="closeAgencyTargetsModal()">Cancel</button>
                    <button type="button" class="upload-button" onclick="saveAgencyTargets()">Save Targets</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (COMPAT - REQUIRED) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="mm-firebase-config.js?v=1778063100000"></script>

    <!-- Centralized Data Store -->
    <script src="dashboard-data-store.js?v=1778059031137"></script>
    <script src="icons.js"></script>
    <script src="dashboard-copy.js?v=1778064200000"></script>
    <script src="agency-dashboard.js?v=1778059031137"></script>
</body>
</html>
