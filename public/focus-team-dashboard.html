<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="icon" type="image/png" href="assets/fairdee-favicon.png">
    <link rel="apple-touch-icon" href="assets/fairdee-apple-touch-icon.png">
<title>Focus Team List Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1778061958986">
</head>
<body>
    <div id="loadingBar" class="loading-bar"></div>
    <div class="container">
        <!-- Header (hidden when in iframe) -->
        <header class="dashboard-header" id="dashboardHeader">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-icon"></div>
                    <h1>Focus Team List</h1>
                </div>
                <a href="index.html" class="back-link">← Back to Main Dashboard</a>
            </div>
        </header>

        <!-- No Data Message -->
        <section class="upload-section" id="noDataSection">
            <div class="upload-zone">
                <div class="upload-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
                    </svg>
                </div>
                <h2>No Focus Team Data Available</h2>
                <p>No Focus Team data is currently available.</p>
            </div>
        </section>

        <!-- Dashboard Content -->
        <div class="dashboard-content" id="dashboardContent" style="display: none;">


            <section class="focus-team-section">
                <div class="section-header">
                    <h2>Focus team list</h2>
                    <div class="focus-team-header-actions">
                        <span id="dataStatus" style="font-size: 0.875rem; color: #10b981; align-self: center;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.15em;"><polyline points="20 6 9 17 4 12"></polyline></svg> Data loaded from storage
                        </span>
                        <button class="upload-button" onclick="openFocusTeamTargetsModal()" style="padding: 0.625rem 1.25rem;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px; vertical-align: middle;">
                                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            Set Team Targets
                        </button>
                    </div>
                </div>

                <!-- Focus Team Table -->
                <div class="focus-team-table-container" style="overflow-x: auto;">
                    <table class="focus-team-table" style="width: 100%; border-collapse: collapse;">
                        <thead id="focusTeamTableHead">
                            <!-- Headers will be populated dynamically -->
                        </thead>
                        <tbody id="focusTeamTableBody">
                            <!-- Data will be populated here -->
                        </tbody>
                    </table>
                </div>

                <!-- Tier Performance Charts -->
                <div id="tierChartsSection" style="display:none; margin-top:2rem;">

                    <!-- Run Rate Controls -->
                    <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
                        <label style="display:flex; align-items:center; gap:0.45rem; cursor:pointer; font-weight:600; color:#1e293b; font-size:0.875rem; user-select:none;">
                            <input type="checkbox" id="ftShowRunRate" style="width:15px; height:15px; accent-color:#f59e0b; cursor:pointer;">
                            Show Run Rate
                        </label>
                        <div id="ftRunRateInputs" style="display:none; align-items:center; gap:0.5rem; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:0.375rem 0.75rem;">
                            <span style="font-size:0.8rem; color:#92400e; font-weight:500;">Today = day</span>
                            <input type="number" id="ftRunRateDay" min="1" max="31" value="22"
                                style="width:52px; padding:0.25rem 0.4rem; border:1px solid #fcd34d; border-radius:6px; font-family:'Google Sans Text',monospace; font-size:0.875rem; font-weight:600; text-align:center; background:white; color:#1e293b;">
                            <span style="font-size:0.8rem; color:#92400e; font-weight:500;">of this month</span>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">

                        <!-- Focus Team Chart -->
                        <div style="background:white; border-radius:12px; padding:1.25rem; box-shadow:0 2px 8px rgba(0,0,0,0.06); border:1px solid #e2e8f0;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                                <span id="focusChartTitle" style="font-size:0.9rem; font-weight:600; color:#475569;"></span>
                                <button id="refreshFocusChart" style="background:#f1f5f9; border:none; border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;">↺</button>
                            </div>
                            <div style="position:relative; height:280px;">
                                <canvas id="focusTeamChart"></canvas>
                            </div>
                            <div id="focusChartBanner" style="margin-top:0.75rem; padding:0.5rem; border-radius:6px; text-align:center; font-weight:700; font-size:0.875rem; color:white;"></div>
                        </div>

                        <!-- Mid Tier Chart -->
                        <div style="background:white; border-radius:12px; padding:1.25rem; box-shadow:0 2px 8px rgba(0,0,0,0.06); border:1px solid #e2e8f0;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                                <span id="midChartTitle" style="font-size:0.9rem; font-weight:600; color:#475569;"></span>
                                <button id="refreshMidChart" style="background:#f1f5f9; border:none; border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;">↺</button>
                            </div>
                            <div style="position:relative; height:280px;">
                                <canvas id="midTierChart"></canvas>
                            </div>
                            <div id="midChartBanner" style="margin-top:0.75rem; padding:0.5rem; border-radius:6px; text-align:center; font-weight:700; font-size:0.875rem; color:white;"></div>
                        </div>

                    </div><!-- end grid -->
                </div><!-- end tierChartsSection -->

            </section>

        </div>
    </div>

    <!-- Focus Team Targets Modal -->
    <div id="focusTeamTargetsModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 1000px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h2>Set Focus Team Targets</h2>
                <button class="modal-close" onclick="closeFocusTeamTargetsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Month *</label>
                    <input type="month" id="focusTeamTargetMonth" class="form-input" required>
                </div>

                <h3 style="margin: 1.5rem 0 1rem 0; color: var(--text-primary);">Team Anchor Targets (THB)</h3>


                <div id="focusTeamTargetsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
                    <!-- Dynamic team anchor input fields will be added here -->
                </div>

                <div class="modal-actions">
                    <button type="button" class="button-secondary" onclick="closeFocusTeamTargetsModal()">Cancel</button>
                    <button type="button" class="upload-button" onclick="saveFocusTeamTargets()">Save Targets</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (COMPAT – REQUIRED) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>


    <!-- Your Firebase config MUST be after SDK -->
    <script src="mm-firebase-config.js?v=1778063100000"></script>

    <!-- Centralized Data Store -->
    <script src="dashboard-data-store.js?v=1778059239583"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="chart-value-labels.js?v=1779000000000"></script>
    <script src="icons.js"></script>
    <script src="dashboard-copy.js?v=1778064200000"></script>
    <script src="run-rate-global.js?v=1778066000000"></script>
    <script src="focus-team-dashboard.js?v=1779000000000"></script>
</body>
</html>
