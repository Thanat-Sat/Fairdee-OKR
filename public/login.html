<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="icon" type="image/png" href="assets/fairdee-favicon.png">
    <link rel="apple-touch-icon" href="assets/fairdee-apple-touch-icon.png">
<title>Login - Fairdee OKR Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 2rem;
        }

        /* Override body styles from styles.css */
        body {
            padding: 0 !important;
            margin: 0 !important;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%) !important;
        }

        .auth-box {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            animation: scaleIn 0.5s ease-out;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border-radius: 12px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: 800;
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Google Sans Text', sans-serif;
            transition: all 0.2s ease;
            background: var(--bg);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-button {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Google Sans Text', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-md);
        }

        .form-button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .form-button:active {
            transform: translateY(0);
        }

        .form-button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-toggle-link {
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .auth-toggle-link:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #FEE;
            color: #C33;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border: 1px solid #FCC;
        }

        .success-message {
            background: #EFE;
            color: #393;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border: 1px solid #CFC;
        }

        .hidden {
            display: none;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin: 1.25rem 0;
            gap: 0.75rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E5E7EB;
        }

        .google-button {
            width: 100%;
            padding: 0.85rem 1rem;
            background: white;
            color: #3C4043;
            border: 1px solid #DADCE0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Google Sans Text', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .google-button:hover {
            background: #F8F9FA;
            box-shadow: var(--shadow-md);
        }

        .google-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .google-button svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">S</div>
                <h1 class="auth-title" id="authTitle">Sign In</h1>
                <p class="auth-subtitle" id="authSubtitle">Access Fairdee OKR Dashboard</p>
            </div>

            <div id="errorMessage" class="error-message hidden"></div>
            <div id="successMessage" class="success-message hidden"></div>

            <button type="button" class="google-button" id="googleSignInButton">
                <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                Continue with Google
            </button>

            <div class="auth-divider">or</div>

            <!-- Sign In Form -->
            <form id="signInForm">
                <div class="form-group">
                    <label class="form-label" for="signInEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="signInEmail" 
                        class="form-input" 
                        placeholder="your.email@company.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="signInPassword">Password</label>
                    <input 
                        type="password" 
                        id="signInPassword" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="form-button" id="signInButton">
                    Sign In
                </button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signUpForm" class="hidden">
                <div class="form-group">
                    <label class="form-label" for="signUpName">Full Name</label>
                    <input 
                        type="text" 
                        id="signUpName" 
                        class="form-input" 
                        placeholder="John Doe"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="signUpEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="signUpEmail" 
                        class="form-input" 
                        placeholder="your.email@company.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="signUpPassword">Password</label>
                    <input 
                        type="password" 
                        id="signUpPassword" 
                        class="form-input" 
                        placeholder="At least 6 characters"
                        required
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="signUpPasswordConfirm">Confirm Password</label>
                    <input 
                        type="password" 
                        id="signUpPasswordConfirm" 
                        class="form-input" 
                        placeholder="Re-enter your password"
                        required
                    >
                </div>

                <button type="submit" class="form-button" id="signUpButton">
                    Create Account
                </button>
            </form>

            <div class="auth-toggle">
                <span id="toggleText">Don't have an account?</span>
                <a class="auth-toggle-link" id="toggleLink">Sign Up</a>
            </div>
        </div>
    </div>


    <!-- Firebase SDK (COMPAT – REQUIRED) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>


    <!-- Your Firebase config MUST be after SDK -->
    <script src="firebase-config.js"></script>


    <!-- Auth Logic -->
    <script src="auth.js"></script>
</body>
</html>
