<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="assets/fairdee-favicon.png">
    <link rel="apple-touch-icon" href="assets/fairdee-apple-touch-icon.png">
    <title>KAM Performance Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <div class="brand">
                    <img src="assets/fairdee-logo.png" alt="Fairdee" class="brand-logo">
                    <h1>KAM Performance Dashboard</h1>
                </div>
                <div class="user-menu">
                    <a href="index.html" class="home-btn">← Home</a>
                    <span id="userEmail" class="user-email"></span>
                    <button id="signOutBtn" class="sign-out-btn">Sign Out</button>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-button active" data-tab="kam">KAM Analysis</button>
                <button class="tab-button" data-tab="focusteam">Focus Team Performance</button>
                <button class="tab-button" data-tab="portfolio">KAM Portfolio</button>
                <button class="tab-button" data-tab="trip">Incentive Trip</button>
            </div>
        </header>

        <!-- Universal controls: drive every tab (except Incentive Trip) -->
        <div id="kamControlsBar" style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; background: #fff; border: 1px solid #E8ECF0; border-radius: 12px; box-shadow: 0 2px 8px rgba(10,14,39,0.04); padding: 0.85rem 1.25rem; margin: 1rem 0;">
            <div style="display: inline-flex; align-items: center; gap: 0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <label for="kamMonthSelect" style="font-weight: 700; font-size: 0.85rem; color: #0A0E27;">Month</label>
                <select id="kamMonthSelect" class="global-month-select" aria-label="Select month">
                    <option value="01">January</option><option value="02">February</option><option value="03">March</option>
                    <option value="04">April</option><option value="05">May</option><option value="06">June</option>
                    <option value="07">July</option><option value="08">August</option><option value="09">September</option>
                    <option value="10">October</option><option value="11">November</option><option value="12">December</option>
                </select>
                <select id="kamYearSelect" class="global-month-select global-year-select" aria-label="Select year"></select>
            </div>
            <div style="width: 1px; height: 24px; background: #E8ECF0;"></div>
            <div id="kamRunRateGroup" style="display: inline-flex; align-items: center; gap: 0.75rem; background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 8px; padding: 0.35rem 0.85rem;">
                <label style="display: inline-flex; align-items: center; gap: 0.45rem; cursor: pointer; font-weight: 700; font-size: 0.85rem; color: #92400E; user-select: none;">
                    <input type="checkbox" id="kamRunRateToggle" style="width: 15px; height: 15px; accent-color: #EA580C; cursor: pointer;">
                    Show Run Rate
                </label>
                <span id="kamRunRateInputs" style="display: none; align-items: center; gap: 0.4rem;">
                    <span style="font-size: 0.8rem; color: #92400E; font-weight: 500;">Day</span>
                    <input type="number" id="kamRunRateDay" min="1" max="31" value="11"
                        style="width: 52px; padding: 0.25rem 0.4rem; border: 1px solid #FCD34D; border-radius: 6px; font-family: 'Google Sans Text', monospace; font-size: 0.85rem; font-weight: 600; text-align: center; background: #fff; color: #1e293b;">
                    <span id="kamRunRateDaysSuffix" style="font-size: 0.8rem; color: #92400E; font-weight: 500;">of 30</span>
                </span>
            </div>
        </div>

        <!-- KAM Analysis (the OKR dashboard's KAM Analysis tab, embedded) -->
        <div class="iframe-container" id="kamContainer">
            <iframe id="kamFrame" src="okr-dashboard.html?embed=kam" frameborder="0"></iframe>
        </div>

        <!-- Focus Team Performance (lazy-loaded on first open) -->
        <div class="iframe-container" id="focusteamContainer" style="display: none;">
            <iframe id="focusteamFrame" data-src="focus-team-dashboard.html?v=1786001400000" frameborder="0"></iframe>
        </div>

        <!-- KAM Portfolio (lazy-loaded on first open) -->
        <div class="iframe-container" id="portfolioContainer" style="display: none;">
            <iframe id="portfolioFrame" data-src="kam-portfolio.html?v=1786001400000" frameborder="0"></iframe>
        </div>

        <!-- Incentive Trip Monitor (lazy-loaded on first open) -->
        <div class="iframe-container" id="tripContainer" style="display: none;">
            <iframe id="tripFrame" data-src="incentive-trip.html" frameborder="0"></iframe>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // ---- Auth gate (same pattern as the hub) ----
        function waitForAuth() {
            if (!window.authManager) { setTimeout(waitForAuth, 100); return; }
            authManager.onAuthStateChanged(function (user) {
                if (!user) { window.location.href = 'login.html'; return; }
                var emailEl = document.getElementById('userEmail');
                if (emailEl) emailEl.textContent = user.email || 'User';
            });
            document.getElementById('signOutBtn').addEventListener('click', async function () {
                await authManager.signOut();
                window.location.href = 'login.html';
            });
        }
        waitForAuth();

        // ---- Eagerly load every tab's data on open + workspace loading toast ----
        (function () {
            var frames = Array.prototype.slice.call(document.querySelectorAll('.iframe-container iframe'));

            // Kick off every frame's load immediately so all 4 tabs' data fetches
            // run in the background as soon as the workspace opens.
            frames.forEach(function (f) {
                f.addEventListener('load', function () {
                    // Push the current month + run rate into the freshly-loaded frame
                    if (f.id !== 'tripFrame' && window.kamBroadcastAll) window.kamBroadcastAll();
                });
                if (!f.src && f.dataset.src) f.src = f.dataset.src;
            });
            // Re-apply after data has had time to load (the OKR embed resets its own
            // month while fetching, so re-broadcast to keep it in sync).
            window.addEventListener('load', function () {
                setTimeout(function () { if (window.kamBroadcastAll) window.kamBroadcastAll(); }, 2500);
                setTimeout(function () { if (window.kamBroadcastAll) window.kamBroadcastAll(); }, 5000);
            });
        })();

        // ---- Universal controls: month + run rate, broadcast to all tabs except Trip ----
        (function () {
            var monthSel = document.getElementById('kamMonthSelect');
            var yearSel = document.getElementById('kamYearSelect');
            var rrToggle = document.getElementById('kamRunRateToggle');
            var rrInputs = document.getElementById('kamRunRateInputs');
            var rrDay = document.getElementById('kamRunRateDay');
            var rrSuffix = document.getElementById('kamRunRateDaysSuffix');
            var RR_KEY = 'fairdee_run_rate_v1';
            var now = new Date();
            var curY = now.getFullYear();
            for (var y = curY + 1; y >= 2023; y--) {
                var o = document.createElement('option');
                o.value = String(y); o.textContent = String(y);
                yearSel.appendChild(o);
            }
            // Seed month
            var saved = localStorage.getItem('dashboard_selected_month');
            var parts = (saved && /^\d{4}-\d{2}$/.test(saved))
                ? { y: saved.slice(0, 4), m: saved.slice(5, 7) }
                : { y: String(curY), m: String(now.getMonth() + 1).padStart(2, '0') };
            monthSel.value = parts.m;
            yearSel.value = parts.y;
            localStorage.setItem('dashboard_selected_month', parts.y + '-' + parts.m);

            // Seed run rate from the shared globalRunRate localStorage
            try {
                var rr = JSON.parse(localStorage.getItem(RR_KEY) || '{}');
                rrToggle.checked = !!rr.enabled;
                if (rr.date && /^\d{4}-\d{2}-\d{2}$/.test(rr.date)) rrDay.value = parseInt(rr.date.slice(8, 10), 10);
            } catch (e) {}

            function daysInMonth(yyyymm) {
                var p = yyyymm.split('-');
                return new Date(parseInt(p[0], 10), parseInt(p[1], 10), 0).getDate();
            }
            function curMonth() { return yearSel.value + '-' + monthSel.value; }

            function syncRunRateUI() {
                var dim = daysInMonth(curMonth());
                rrDay.max = dim;
                if (parseInt(rrDay.value, 10) > dim) rrDay.value = dim;
                rrSuffix.textContent = 'of ' + dim;
                rrInputs.style.display = rrToggle.checked ? 'inline-flex' : 'none';
            }

            function post(type, payload) {
                ['kamFrame', 'focusteamFrame', 'portfolioFrame'].forEach(function (id) { // not tripFrame
                    var f = document.getElementById(id);
                    if (f && f.contentWindow) { try { f.contentWindow.postMessage(Object.assign({ type: type }, payload), '*'); } catch (e) {} }
                });
            }

            function broadcastMonth() {
                var month = curMonth();
                localStorage.setItem('dashboard_selected_month', month);
                syncRunRateUI();
                post('monthChange', { month: month });
                // a month change also moves the run-rate target month
                if (rrToggle.checked) broadcastRunRate();
            }

            function broadcastRunRate() {
                var month = curMonth();
                var dim = daysInMonth(month);
                var day = Math.min(dim, Math.max(1, parseInt(rrDay.value, 10) || 1));
                rrDay.value = day;
                var date = month + '-' + String(day).padStart(2, '0');
                // Persist in the shared run-rate store (Focus Team reads this)
                try {
                    var prev = JSON.parse(localStorage.getItem(RR_KEY) || '{}');
                    localStorage.setItem(RR_KEY, JSON.stringify(Object.assign({ applyTo: { month: true } }, prev, { enabled: rrToggle.checked, date: date })));
                } catch (e) {}
                post('runRateChange', { enabled: rrToggle.checked, day: day, month: month, date: date });
            }

            monthSel.addEventListener('change', broadcastMonth);
            yearSel.addEventListener('change', broadcastMonth);
            rrToggle.addEventListener('change', function () { syncRunRateUI(); broadcastRunRate(); });
            rrDay.addEventListener('input', function () { syncRunRateUI(); broadcastRunRate(); });

            syncRunRateUI();
            window.kamBroadcastAll = function () { broadcastMonth(); broadcastRunRate(); };
        })();

        // ---- Tab switching (frames are already loaded; just show/hide) ----
        document.querySelectorAll('.tab-button').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var tab = btn.getAttribute('data-tab');
                document.querySelectorAll('.tab-button').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                document.querySelectorAll('.iframe-container').forEach(function (c) { c.style.display = 'none'; });
                var container = document.getElementById(tab + 'Container');
                if (container) container.style.display = 'block';
                // Controls apply to every tab except Incentive Trip
                document.getElementById('kamControlsBar').style.display = (tab === 'trip') ? 'none' : 'flex';
                // Re-broadcast so the now-visible frame re-lays-out at the current state
                if (tab !== 'trip' && window.kamBroadcastAll) window.kamBroadcastAll();
            });
        });
    </script>
</body>
</html>
