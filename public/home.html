<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fairdee Dashboard Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Google Sans Text', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hub-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hub-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin: 0 auto 1.25rem;
            display: block;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.35);
        }

        .hub-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .hub-subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
        }

        .hub-cards {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 760px;
            width: 100%;
        }

        .hub-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            flex: 1;
            min-width: 280px;
            max-width: 340px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .hub-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 107, 53, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.3);
        }

        .hub-card-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        .hub-card-icon svg {
            width: 34px;
            height: 34px;
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hub-card-icon.okr {
            background: linear-gradient(135deg, #FF6B35 0%, #E85A2B 100%);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
        }

        .hub-card-icon.mm {
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .hub-card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.75rem;
        }

        .hub-card-desc {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.6;
        }

        .hub-card-arrow {
            margin-top: 1.75rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }

        .hub-card-arrow svg {
            width: 18px;
            height: 18px;
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.25;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hub-card:hover .hub-card-arrow {
            background: rgba(255, 107, 53, 0.25);
            color: #FF6B35;
        }

        .hub-card.mm:hover .hub-card-arrow {
            background: rgba(99, 102, 241, 0.25);
            color: #818CF8;
        }

        .hub-footer {
            margin-top: 3rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .hub-user {
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.85rem;
        }

        .hub-signout {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-family: 'Google Sans Text', sans-serif;
            transition: all 0.2s ease;
        }

        .hub-signout:hover {
            border-color: rgba(239, 68, 68, 0.5);
            color: #F87171;
        }

        /* Auth loading overlay */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .auth-overlay.hidden { opacity: 0; pointer-events: none; }
        .auth-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #FF6B35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-spinner"></div>
    </div>

    <div class="hub-header">
        <img src="assets/fairdee-logo.png" alt="Fairdee" class="hub-logo">
        <h1 class="hub-title">Fairdee Dashboards</h1>
        <p class="hub-subtitle">Choose a dashboard to open</p>
    </div>

    <div class="hub-cards">
        <a class="hub-card" href="index.html">
            <div class="hub-card-icon okr" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"></circle>
                    <circle cx="12" cy="12" r="5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <path d="M12 3v3"></path>
                    <path d="M21 12h-3"></path>
                </svg>
            </div>
            <div class="hub-card-title">OKR Dashboard</div>
            <p class="hub-card-desc">Track objectives and key results, KAM performance, fleet analysis, and monthly targets.</p>
            <div class="hub-card-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                </svg>
            </div>
        </a>

        <a class="hub-card mm" href="mm.html">
            <div class="hub-card-icon mm" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19V5"></path>
                    <path d="M4 19h16"></path>
                    <rect x="7" y="11" width="3" height="5" rx="1"></rect>
                    <rect x="12" y="8" width="3" height="8" rx="1"></rect>
                    <rect x="17" y="4" width="3" height="12" rx="1"></rect>
                </svg>
            </div>
            <div class="hub-card-title">Monthly Metrics</div>
            <p class="hub-card-desc">Executive summary, channel overview, MLM, focus team, agency, segment, and renewal dashboards.</p>
            <div class="hub-card-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                </svg>
            </div>
        </a>
    </div>

    <div class="hub-footer">
        <span class="hub-user" id="hubUserEmail"></span>
        <button class="hub-signout" id="hubSignOut">Sign Out</button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        function waitForAuth() {
            if (!window.authManager) { setTimeout(waitForAuth, 100); return; }

            authManager.onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                document.getElementById('hubUserEmail').textContent = user.email;
                document.getElementById('authOverlay').classList.add('hidden');
            });

            document.getElementById('hubSignOut').addEventListener('click', async () => {
                await authManager.signOut();
                window.location.href = 'login.html';
            });
        }
        waitForAuth();
    </script>
</body>
</html>
